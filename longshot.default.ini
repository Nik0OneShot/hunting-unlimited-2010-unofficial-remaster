; Longshot settings. Most of these are also in the game, under Options, then Longshot.
; Delete a line to go back to its default.

[display]
; 0 means use your current desktop value. Matching your desktop gives borderless
; fullscreen. Any other resolution switches the display mode like the original game.
width=0
height=0
refresh=0
; 1 = sync to the monitor, no tearing. 0 = off, use with fps_cap or a FreeSync display.
vsync=1
; Frame rate limit. 0 = no limit.
fps_cap=0

[view]
; hor_plus = wider screens see more. stock = original behaviour, crops top and bottom.
fov_mode=hor_plus
; Multiplies the view width. 1.0 keeps the game's own framing.
fov_scale=1.0
; How smoothly scopes change zoom, in milliseconds. Higher glides more slowly.
; 0 = instant jumps between zoom levels, like the original.
zoom_smoothing_ms=60
; How smoothly menu lists scroll, in milliseconds. Higher glides more slowly.
; 0 = rows jump, like the original.
menu_scroll_smoothing_ms=45
; center_4_3 = menus and HUD at correct proportions in the middle of the screen.
; stretch = original behaviour, stretched to fill.
ui_layout=center_4_3
; Where the hunting HUD sits on wide screens, with ui_layout=center_4_3:
; edges = out at the edges of the screen.
; 16_9  = at the edges of a centred 16:9 area.
; 4_3   = at the edges of a centred 4:3 area, as in the original.
hud_layout=edges
; Smooths jagged edges. 0 = off, or 2, 4 or 8 samples. Higher looks better and costs more.
anti_aliasing=0
; 1 = with anti-aliasing on, also smooths the edges of leaves and grass.
smooth_foliage=1
; Keeps textures sharp at a distance and at shallow angles. Up to 16.
; 0 = use the game's own setting, in Options, then Graphics.
texture_filtering=0
; How far out grass reaches, in metres, up to 85. 0 = the game's own 24.
grass_distance=0
; Multiplies how far out trees and animals keep their detail. 1 = the game's own, which is full
; detail out to 100 metres. Higher looks better and costs more, mostly on the processor. Zooming in
; extends it too, and the two together stop at 8 times, unless zooming alone goes further.
lod_distance=1
; 1 = skip terrain and trees hidden behind the ground, which looks the same and draws less.
; 0 = draw them anyway, as the game does.
occlusion_culling=1
; The next three only apply during a hunt, and never touch the HUD. 0 = off.
; Sharpens the picture, from 0 to 1. Pairs well with anti-aliasing.
sharpening=0
; Richer colour, from 0 to 1.
vibrance=0
; A soft glow around bright areas like the sun, from 0 to 1.
bloom=0

[mouse]
; 1 = read the mouse with Raw Input, with no lost movement and working side buttons.
raw_input=1
; 1 = aim speed stays the same at any frame rate. 0 = original behaviour, where the
; same hand movement turns less as the frame rate rises.
fps_independent=1
; With fps_independent on, your in-game sensitivity feels as it did at this frame rate.
; Higher is slower and finer, because each mouse count turns the view less. logs\longshot.log
; shows how far one count turns the view, and under about 1 pixel looks smooth.
reference_hz=240
; Multipliers on top of the in-game sensitivity. Type any exact value.
sensitivity_x=1.0
sensitivity_y=1.0
; How scopes and binoculars change aim speed:
; proportional = scales with the zoom level, so tracking feels the same at any zoom.
; off          = the same aim speed zoomed in or out.
; stock        = the game's own fixed reduction.
zoom_mode=proportional
; How far your mouse travels for a full turn, in centimetres. 0 = use the in-game slider.
; Any exact value works. Needs fps_independent=1 and your mouse's real mouse_dpi.
; sensitivity_x and sensitivity_y still multiply it.
cm_per_360=0
mouse_dpi=800

[timing]
; 1 = sub-millisecond game clock. 0 = original 1 ms clock.
high_res_timer=1

[game]
; 1 = you walk where you're heading, without the game's friction pulling you sideways.
straight_walking=1
; 1 = presses made while a weapon is busy wait for it, and the latest one decides.
weapon_queue=1
; How fast weapons and equipment raise, lower and aim. 1 = the game's speed, up to 2.
action_speed=1
; 1 = the ATV pulls away properly, climbs hills, tops out at 55 km/h instead of 25, stops
; bouncing, brakes, holds its line, and lands on its wheels instead of flipping. The view behind it
; keeps up at speed. The suspension part takes effect on the next ATV.
strong_atv=1
; Hold this key on foot to look around without changing where you're heading, and the gun
; fires where you look. 164 = left alt, 165 = right alt, 5 and 6 = the mouse's side buttons,
; or any Windows virtual key code. 0 = off.
freelook_key=164
; How far freelook turns your head, in degrees to each side, and up and down.
freelook_yaw=100
freelook_pitch=60
; 1 = animals can't see or smell you up in a tree stand, only hear you. 0 = as the game has it.
stand_hidden=1
; 1 = leaves near you thin out while you're up in a tree stand. 0 = as the game has it.
stand_clear_view=1
; 1 = walk at walk_speed, and go backwards and sideways at side_speed. 0 = the game's speeds,
; 1.6 m/s forward and half that otherwise.
faster_walking=1
; In metres a second.
walk_speed=1.9
; How fast backwards and sideways are, as a share of forward. This goes for running too.
side_speed=0.8
; 1 = footsteps get louder the faster you go, and animals hear you the same way.
; 0 = the game's fixed noise for each stance.
speed_noise=1
; 1 = weapon sway moves the whole view in ironsights, as it does in a scope, so a shot goes where
;     the sights are. 0 = the game's sway, which moves the gun and the shot by different amounts.
irons_view_sway=1
; 1 = show the game's shot of a nearby animal when a free hunt starts.
free_hunt_opening=0
; 1 = new herds keep arriving during a free hunt, to hold the population you chose.
free_hunt_animals=1
; 1 = in a free hunt, animals only bolt from something they've actually noticed.
; 0 = the game's way, where leftover stress can send one running from nothing.
free_hunt_calm_animals=1
; 1 = bigger herds, young with their mothers, animals that go to water, panic together and keep to
; the time of day, kills that draw scavengers, and many more birds. 0 = the animals as the game has them.
free_hunt_wildlife=1
; How long a whole day takes in a free hunt, in minutes. 0 = the time you pick stays as it is.
free_hunt_day_minutes=48
; How bright moonlight is. 1 = as intended, 2 = twice that, 0 = pitch black.
free_hunt_night_light=1
; 1 = the free hunt map marker can go almost anywhere, and a hunt that would start in water moves
;     to the nearest dry ground. 0 = only the game's start points, about 200 m apart.
free_hunt_any_marker=1
; 1 = never show the intro. 0 = show it, and any key or mouse click skips it.
skip_intro=0
; 1 = a hunt pauses and goes quiet while the game is in the background, and carries on when
;     you come back.
; 0 = a hunt and its sound keep running while you are alt-tabbed out.
pause_in_background=0

[paths]
; Leave empty to find the Steam install automatically.
game_dir=
