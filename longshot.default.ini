; Longshot settings. Most of these are also in the game, under Options, then Longshot.
; Delete a line to go back to its default.

[display]
; 0 means use your current desktop value. Matching your desktop gives borderless
; fullscreen. Any other resolution switches the display mode like the original game.
width=0
height=0
refresh=0
; 1 = sync to the monitor, no tearing. 0 = off, use with fps_cap or a FreeSync display.
vsync=1
; Frame rate limit. 0 = no limit.
fps_cap=0

[view]
; hor_plus = wider screens see more. stock = original behaviour, crops top and bottom.
fov_mode=hor_plus
; Multiplies the view width. 1.0 keeps the game's own framing.
fov_scale=1.0
; How smoothly scopes change zoom, in milliseconds. Higher glides more slowly.
; 0 = instant jumps between zoom levels, like the original.
zoom_smoothing_ms=60
; How smoothly menu lists scroll, in milliseconds. Higher glides more slowly.
; 0 = rows jump, like the original.
menu_scroll_smoothing_ms=45
; center_4_3 = menus and HUD at correct proportions in the middle of the screen.
; stretch = original behaviour, stretched to fill.
ui_layout=center_4_3
; Where the hunting HUD sits on wide screens, with ui_layout=center_4_3:
; edges = out at the edges of the screen.
; 16_9  = at the edges of a centred 16:9 area.
; 4_3   = at the edges of a centred 4:3 area, as in the original.
hud_layout=edges

[mouse]
; 1 = read the mouse with Raw Input, with no lost movement and working side buttons.
raw_input=1
; 1 = aim speed stays the same at any frame rate. 0 = original behaviour, where the
; same hand movement turns less as the frame rate rises.
fps_independent=1
; With fps_independent on, your in-game sensitivity feels as it did at this frame rate.
; Higher is slower and finer, because each mouse count turns the view less. logs\longshot.log
; shows how far one count turns the view, and under about 1 pixel looks smooth.
reference_hz=240
; Multipliers on top of the in-game sensitivity. Type any exact value.
sensitivity_x=1.0
sensitivity_y=1.0
; How scopes and binoculars change aim speed:
; proportional = scales with the zoom level, so tracking feels the same at any zoom.
; off          = the same aim speed zoomed in or out.
; stock        = the game's own fixed reduction.
zoom_mode=proportional
; How far your mouse travels for a full turn, in centimetres. 0 = use the in-game slider.
; Any exact value works. Needs fps_independent=1 and your mouse's real mouse_dpi.
; sensitivity_x and sensitivity_y still multiply it.
cm_per_360=0
mouse_dpi=800

[timing]
; 1 = sub-millisecond game clock. 0 = original 1 ms clock.
high_res_timer=1

[game]
; 1 = never show the intro. 0 = show it, and any key or mouse click skips it.
skip_intro=0
; 1 = a hunt pauses and goes quiet while the game is in the background, and carries on when
;     you come back.
; 0 = a hunt and its sound keep running while you are alt-tabbed out.
pause_in_background=0

[paths]
; Leave empty to find the Steam install automatically.
game_dir=
